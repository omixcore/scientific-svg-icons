<svg xmlns="http://www.w3.org/2000/svg" width="160" height="120" viewBox="0 0 160 120" role="img" aria-labelledby="title desc"><title id="title">QTL interval mapping</title><desc id="desc">Illustrative QTL LOD profile with a peak, confidence interval, and chromosome marker positions.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#263746"/></marker></defs><path d="M15 12v91h135" fill="none" stroke="#263746" stroke-width="2"/><path d="M16 75H149" stroke="#D98262" stroke-width="1.5" stroke-dasharray="4 3"/><text x="147" y="70" text-anchor="end" font-family="Arial,sans-serif" font-size="7" fill="#A14D3D">LOD threshold</text><rect x="63" y="15" width="42" height="87" fill="#E7B96D" opacity=".18"/><path d="M17 88L31 82 44 85 57 70 68 55 78 24 86 19 95 40 107 67 119 78 132 84 148 88" fill="none" stroke="#4389C8" stroke-width="2.7" stroke-linejoin="round"/><path d="M86 19v84" stroke="#4389C8" stroke-width="1.2" stroke-dasharray="3 3"/><circle cx="86" cy="19" r="4" fill="#D98262" stroke="#A14D3D" stroke-width="1.3"/><text x="86" y="11" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#263746">QTL peak</text><text x="80" y="117" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#263746">Genetic position (cM)</text></svg>
