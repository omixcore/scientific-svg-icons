<svg xmlns="http://www.w3.org/2000/svg" width="160" height="120" viewBox="0 0 160 120" role="img" aria-labelledby="title desc"><title id="title">GWAS Manhattan plot</title><desc id="desc">Illustrative Manhattan plot with chromosome-wise association points and a genome-wide significance threshold.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#263746"/></marker></defs><path d="M12 10v96h142" fill="none" stroke="#263746" stroke-width="2"/><path d="M13 36H153" stroke="#D98262" stroke-width="1.5" stroke-dasharray="5 3"/><text x="151" y="31" text-anchor="end" font-family="Arial,sans-serif" font-size="7" fill="#A14D3D">Significance threshold</text><g fill="#4389C8"><circle cx="20" cy="78" r="2.3"/><circle cx="25" cy="69" r="2.3"/><circle cx="30" cy="83" r="2.3"/><circle cx="35" cy="61" r="2.3"/><circle cx="40" cy="74" r="2.3"/><circle cx="45" cy="54" r="2.3"/><circle cx="50" cy="67" r="2.3"/><circle cx="55" cy="80" r="2.3"/><circle cx="60" cy="60" r="2.3"/></g><g fill="#70A96A"><circle cx="68" cy="72" r="2.3"/><circle cx="73" cy="61" r="2.3"/><circle cx="78" cy="75" r="2.3"/><circle cx="83" cy="50" r="2.3"/><circle cx="88" cy="67" r="2.3"/><circle cx="93" cy="23" r="3"/><circle cx="98" cy="15" r="3"/><circle cx="103" cy="30" r="3"/><circle cx="108" cy="58" r="2.3"/></g><g fill="#4389C8"><circle cx="116" cy="73" r="2.3"/><circle cx="121" cy="61" r="2.3"/><circle cx="126" cy="81" r="2.3"/><circle cx="131" cy="66" r="2.3"/><circle cx="136" cy="54" r="2.3"/><circle cx="141" cy="76" r="2.3"/><circle cx="147" cy="63" r="2.3"/></g><text x="80" y="117" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#263746">Chromosome</text><text x="3" y="12" font-family="Arial,sans-serif" font-size="7" fill="#263746">−log₁₀P</text></svg>
