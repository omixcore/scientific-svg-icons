<svg xmlns="http://www.w3.org/2000/svg" width="160" height="120" viewBox="0 0 160 120" role="img" aria-labelledby="title desc"><title id="title">Calvin-Benson cycle</title><desc id="desc">Simplified Calvin-Benson cycle showing carbon fixation, reduction, triose-phosphate output, and RuBP regeneration.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#263746"/></marker></defs><path d="M80 13C113 13 137 34 137 59" fill="none" stroke="#397A50" stroke-width="3" marker-end="url(#arrow)"/><path d="M137 62C137 94 111 108 82 108" fill="none" stroke="#397A50" stroke-width="3" marker-end="url(#arrow)"/><path d="M78 108C46 108 22 89 22 62" fill="none" stroke="#397A50" stroke-width="3" marker-end="url(#arrow)"/><path d="M22 58C22 30 47 13 78 13" fill="none" stroke="#397A50" stroke-width="3" marker-end="url(#arrow)"/><g fill="#DCEBCF" stroke="#397A50" stroke-width="1.8"><rect x="54" y="5" width="52" height="20" rx="7"/><rect x="113" y="47" width="42" height="24" rx="7"/><rect x="52" y="96" width="56" height="20" rx="7"/><rect x="5" y="47" width="43" height="24" rx="7"/></g><g fill="#263746" font-family="Arial,sans-serif" font-size="8" text-anchor="middle"><text x="80" y="18">CO₂ fixation</text><text x="134" y="57">3-PGA</text><text x="134" y="66">reduction</text><text x="80" y="109">RuBP regeneration</text><text x="26" y="57">G3P</text><text x="26" y="66">output</text></g><text x="80" y="57" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#986A36">ATP + NADPH</text><text x="80" y="69" text-anchor="middle" font-family="Arial,sans-serif" font-size="7.5" fill="#986A36">ADP + NADP⁺</text></svg>
