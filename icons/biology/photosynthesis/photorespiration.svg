<svg xmlns="http://www.w3.org/2000/svg" width="160" height="120" viewBox="0 0 160 120" role="img" aria-labelledby="title desc"><title id="title">Photorespiration pathway</title><desc id="desc">Inter-organelle photorespiration pathway connecting chloroplast, peroxisome, and mitochondrion, with glycine decarboxylation and carbon recovery.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#263746"/></marker></defs><rect x="4" y="10" width="48" height="43" rx="8" fill="#DCEBCF" stroke="#5E8A61" stroke-width="2"/><rect x="57" y="10" width="47" height="43" rx="8" fill="#E8E0F0" stroke="#80689A" stroke-width="2"/><rect x="109" y="10" width="47" height="43" rx="8" fill="#F5E8C9" stroke="#A77D42" stroke-width="2"/><g fill="#263746" font-family="Arial,sans-serif" font-size="7" text-anchor="middle"><text x="28" y="20">Chloroplast</text><text x="80" y="20">Peroxisome</text><text x="132" y="20">Mitochondrion</text></g><g fill="#FFFFFF" stroke="#7D9B78" stroke-width="1"><rect x="9" y="29" width="38" height="16" rx="4"/><rect x="62" y="29" width="37" height="16" rx="4"/><rect x="114" y="29" width="37" height="16" rx="4"/></g><g fill="#263746" font-family="Arial,sans-serif" font-size="7" text-anchor="middle"><text x="28" y="39">2-PG</text><text x="80" y="39">Glycolate</text><text x="132" y="39">Glycine</text></g><path d="M48 37h13M100 37h13" stroke="#263746" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M132 54v18H80V55" fill="none" stroke="#263746" stroke-width="1.5" marker-end="url(#arrow)"/><text x="106" y="68" font-family="Arial,sans-serif" font-size="7" fill="#263746">Serine</text><path d="M80 54v43H28V55" fill="none" stroke="#263746" stroke-width="1.5" marker-end="url(#arrow)"/><text x="54" y="92" font-family="Arial,sans-serif" font-size="7" fill="#263746">Glycerate</text><text x="132" y="84" text-anchor="middle" font-family="Arial,sans-serif" font-size="7" fill="#A14D3D">CO₂ + NH₃</text><text x="80" y="112" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#263746">3-PGA returns to Calvin cycle</text></svg>
