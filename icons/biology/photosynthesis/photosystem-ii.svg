<svg xmlns="http://www.w3.org/2000/svg" width="160" height="120" viewBox="0 0 160 120" role="img" aria-labelledby="title desc"><title id="title">Photosystem II</title><desc id="desc">Thylakoid membrane schematic of photosystem II with P680, water oxidation on the lumenal side, oxygen release, and electron transfer to plastoquinone.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#263746"/></marker></defs><rect x="5" y="48" width="150" height="27" rx="8" fill="#DCEBCF" stroke="#6C9D5D" stroke-width="1.5"/><path d="M5 54H155M5 69H155" stroke="#6C9D5D" stroke-width="2"/><path d="M62 28Q48 35 52 58Q54 79 69 91Q84 78 87 58Q89 35 75 28Z" fill="#E7B96D" stroke="#986A36" stroke-width="2.5"/><ellipse cx="69" cy="51" rx="11" ry="8" fill="#A9C9E5" stroke="#426B92" stroke-width="1.5"/><text x="69" y="54" text-anchor="middle" font-family="Arial,sans-serif" font-size="7" fill="#263746">P680</text><path d="M69 95V107" stroke="#263746" stroke-width="2" marker-end="url(#arrow)"/><text x="69" y="117" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#263746">H₂O → O₂ + H⁺</text><path d="M87 43Q109 31 127 23" fill="none" stroke="#263746" stroke-width="2" marker-end="url(#arrow)"/><text x="128" y="18" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#263746">PQ</text><text x="12" y="18" font-family="Arial,sans-serif" font-size="8" fill="#263746">Stroma</text><text x="12" y="103" font-family="Arial,sans-serif" font-size="8" fill="#263746">Lumen</text></svg>
