<svg xmlns="http://www.w3.org/2000/svg" width="160" height="120" viewBox="0 0 160 120" role="img" aria-labelledby="title desc"><title id="title">Genetic cross</title><desc id="desc">Mendelian monohybrid cross showing homozygous parental genotypes, heterozygous F1, and F2 1:2:1 genotype segregation.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#263746"/></marker></defs><g fill="#DCEBCF" stroke="#5E8A61" stroke-width="1.8"><rect x="7" y="13" width="48" height="23" rx="6"/><rect x="105" y="13" width="48" height="23" rx="6"/></g><g fill="#263746" font-family="Arial,sans-serif" font-size="9" text-anchor="middle"><text x="31" y="28">AA</text><text x="129" y="28">aa</text><text x="80" y="28">×</text></g><path d="M31 38v16h49M129 38v16H80M80 54v10" fill="none" stroke="#263746" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="55" y="67" width="50" height="22" rx="6" fill="#A9C9E5" stroke="#426B92" stroke-width="1.8"/><text x="80" y="81" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#263746">F1: Aa</text><path d="M80 90v8" stroke="#263746" stroke-width="1.5" marker-end="url(#arrow)"/><text x="80" y="111" text-anchor="middle" font-family="Arial,sans-serif" font-size="9" fill="#263746">F2: 1 AA : 2 Aa : 1 aa</text></svg>
