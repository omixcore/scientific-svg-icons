<svg xmlns="http://www.w3.org/2000/svg" width="160" height="120" viewBox="0 0 160 120" role="img" aria-labelledby="title desc"><title id="title">Gene locus</title><desc id="desc">Genome-browser-style gene locus with promoter, transcription start site, exons, introns, strand direction, and a variant marker.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#263746"/></marker></defs><path d="M10 68H150" stroke="#263746" stroke-width="2"/><rect x="17" y="49" width="28" height="38" rx="3" fill="#DCEBCF" stroke="#5E8A61" stroke-width="1.8"/><text x="31" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#263746">Promoter</text><path d="M45 68H63M63 68l6-5 6 10 6-10 6 10 6-10 6 5" fill="none" stroke="#4389C8" stroke-width="2"/><rect x="99" y="55" width="12" height="26" fill="#77A9D2" stroke="#426B92" stroke-width="1.5"/><rect x="124" y="55" width="17" height="26" fill="#77A9D2" stroke="#426B92" stroke-width="1.5"/><path d="M111 68h13" stroke="#4389C8" stroke-width="2"/><path d="M91 29V57" stroke="#D98262" stroke-width="2" marker-end="url(#arrow)"/><text x="91" y="22" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#263746">TSS</text><path d="M117 32V55M112 32h10" stroke="#986A36" stroke-width="1.7"/><text x="117" y="25" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#263746">SNP</text><text x="80" y="108" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#263746">5′ → 3′ gene model</text></svg>
