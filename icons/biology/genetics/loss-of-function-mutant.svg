<svg xmlns="http://www.w3.org/2000/svg" width="160" height="120" viewBox="0 0 160 120" role="img" aria-labelledby="title desc"><title id="title">Loss-of-function mutant</title><desc id="desc">Schematic comparison of a wild-type gene and a loss-of-function allele with a deletion-induced frameshift and truncated protein.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#263746"/></marker></defs><text x="37" y="13" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#263746">Wild type</text><text x="121" y="13" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#263746">Mutant</text><path d="M8 33H69M91 33H152" stroke="#263746" stroke-width="2"/><g fill="#77A9D2" stroke="#426B92" stroke-width="1.5"><rect x="14" y="24" width="12" height="18"/><rect x="32" y="24" width="12" height="18"/><rect x="50" y="24" width="12" height="18"/><rect x="97" y="24" width="12" height="18"/><rect x="133" y="24" width="12" height="18"/></g><path d="M115 24v18" stroke="#D98262" stroke-width="2.5" stroke-dasharray="2 2"/><text x="121" y="54" text-anchor="middle" font-family="Arial,sans-serif" font-size="7" fill="#A14D3D">deletion</text><path d="M38 48v15m-5-5 5 5 5-5M121 48v15m-5-5 5 5 5-5" fill="none" stroke="#263746" stroke-width="1.5"/><g fill="#70A96A" stroke="#397A50" stroke-width="1.5"><rect x="17" y="69" width="11" height="11" rx="3"/><rect x="31" y="69" width="11" height="11" rx="3"/><rect x="45" y="69" width="11" height="11" rx="3"/><rect x="59" y="69" width="11" height="11" rx="3"/><rect x="102" y="69" width="11" height="11" rx="3"/></g><path d="M113 74h18" stroke="#D98262" stroke-width="2" stroke-dasharray="3 3"/><text x="43" y="98" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#263746">Full-length protein</text><text x="121" y="98" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#263746">Truncated product</text></s