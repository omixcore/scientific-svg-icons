<svg xmlns="http://www.w3.org/2000/svg" width="160" height="120" viewBox="0 0 160 120" role="img" aria-labelledby="title desc"><title id="title">Vascular bundle cross-section</title><desc id="desc">Schematic transverse section of a collateral vascular bundle with bundle sheath, xylem on the adaxial side, and phloem on the abaxial side.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#263746"/></marker></defs><ellipse cx="80" cy="62" rx="61" ry="49" fill="#F3E8CC" stroke="#9C7A49" stroke-width="3"/><ellipse cx="80" cy="62" rx="54" ry="42" fill="none" stroke="#C3A36C" stroke-width="1.5" stroke-dasharray="3 3"/><g fill="#A9C9E5" stroke="#426B92" stroke-width="2"><circle cx="60" cy="42" r="13"/><circle cx="91" cy="42" r="14"/><circle cx="77" cy="63" r="8"/></g><g fill="#E7B96D" stroke="#986A36" stroke-width="1.6"><circle cx="49" cy="78" r="7"/><circle cx="65" cy="87" r="7"/><circle cx="82" cy="88" r="7"/><circle cx="99" cy="82" r="7"/><circle cx="111" cy="68" r="6"/></g><path d="M80 5V14" stroke="#263746" stroke-width="1.5" marker-end="url(#arrow)"/><text x="80" y="116" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#263746">xylem adaxial · phloem abaxial</text></svg>
