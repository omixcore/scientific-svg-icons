<svg xmlns="http://www.w3.org/2000/svg" width="160" height="120" viewBox="0 0 160 120" role="img" aria-labelledby="title desc"><title id="title">C4 carbon-concentrating mechanism</title><desc id="desc">Two-cell C4 pathway showing bicarbonate fixation by PEPC in mesophyll, C4-acid transport, decarboxylation in bundle sheath, Rubisco fixation, and pyruvate return.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#263746"/></marker></defs><rect x="5" y="12" width="70" height="96" rx="12" fill="#E4F0D8" stroke="#5E8A61" stroke-width="2"/><rect x="85" y="12" width="70" height="96" rx="12" fill="#F5E8C9" stroke="#A77D42" stroke-width="2"/><text x="40" y="23" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#263746">Mesophyll</text><text x="120" y="23" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" fill="#263746">Bundle sheath</text><g fill="#FFFFFF" stroke="#397A50" stroke-width="1.2"><rect x="12" y="33" width="56" height="18" rx="5"/><rect x="12" y="59" width="56" height="18" rx="5"/><rect x="92" y="42" width="56" height="18" rx="5"/><rect x="92" y="70" width="56" height="18" rx="5"/></g><g fill="#263746" font-family="Arial,sans-serif" font-size="7" text-anchor="middle"><text x="40" y="44">CA: CO₂ → HCO₃⁻</text><text x="40" y="70">PEPC + PEP → OAA</text><text x="120" y="53">Malate → CO₂</text><text x="120" y="81">Rubisco / Calvin</text></g><path d="M40 51v7" stroke="#263746" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M68 68H91" stroke="#263746" stroke-width="1.7" marker-end="url(#arrow)"/><text x="80" y="63" text-anchor="middle" font-family="Arial,sans-serif" font-size="6.5" fill="#263746">malate</text><path d="M120 61v8" stroke="#263746" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M93 94Q79 108 65 94" fill="none" stroke="#263746" stroke-width="1.7" marker-end="url(#arrow)"/><text x="80" y="116" text-anchor="middle" font-family="Arial,sans-serif" font-size="7" fill="#263746">pyruvate return · PPDK</text></svg>
